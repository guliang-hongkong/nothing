  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" data-link aria-label="Island's forum 离岛的论坛首页">
        <span class="brand-mark" aria-hidden="true">岛</span>
        <span class="brand-text">
          <strong><span class="brand-full">Island's forum</span><span class="brand-short">Island's</span></strong>
          <small>离岛的论坛</small>
        </span>
      </a>

      <nav class="desktop-nav" aria-label="主导航">
        <a href="/" data-link data-nav="home">广场</a>
        <a href="/messages" data-link data-nav="messages">
          私信
          <span class="nav-badge" data-unread-badge hidden></span>
        </a>
      </nav>

      <form class="header-search" id="header-search" role="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input type="search" name="q" placeholder="搜索话题、作者" autocomplete="off" aria-label="搜索话题和作者">
        <kbd>↵</kbd>
      </form>

      <div class="header-actions">
        <button class="icon-button install-button" type="button" data-action="install" title="安装到桌面" aria-label="安装到桌面" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-install"></use></svg>
        </button>
        <button class="icon-button theme-toggle" type="button" data-action="toggle-theme" aria-label="切换深色模式" title="切换深色模式">
          <svg class="icon theme-icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
          <svg class="icon theme-icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
        </button>
        <div id="auth-slot" class="auth-slot"></div>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="boot-loading" role="status" aria-live="polite" aria-label="正在载入 Island's forum">
      <div class="boot-brand">
        <span class="boot-emblem" aria-hidden="true"><span class="loading-mark">岛</span></span>
        <span class="boot-brand-text">
          <strong>Island's forum</strong>
          <small>离岛的论坛</small>
        </span>
      </div>
      <div class="boot-progress" aria-hidden="true"><span></span></div>
      <span class="boot-note">正在登岛…</span>
    </div>
  </main>

  <nav class="mobile-tabbar" aria-label="移动端导航">
    <a href="/" data-link data-nav="home" aria-label="首页">
      <svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg>
      <span>广场</span>
    </a>
    <a href="/search" data-link data-nav="search" aria-label="搜索">
      <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
      <span>发现</span>
    </a>
    <button class="tab-compose" type="button" data-action="compose" aria-label="发布话题">
      <span class="tab-compose-inner"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg></span>
      <span>发布</span>
    </button>
    <a href="/messages" data-link data-nav="messages" aria-label="私信">
      <span class="tab-icon-wrap">
        <svg class="icon" aria-hidden="true"><use href="#i-message"></use></svg>
        <span class="tab-badge" data-unread-badge hidden></span>
      </span>
      <span>私信</span>
    </a>
    <button type="button" data-action="my-profile" data-nav="profile" aria-label="我的主页">
      <svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg>
      <span>我的</span>
    </button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
